name: Apply verified final review fixes
on:
  push:
    branches: [cimo-studio-refresh-2026-09-09]
    paths: [.github/workflows/finish-review.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cimo-studio-refresh-2026-09-09
      - name: Apply exact locally verified edits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re
          p=Path('studio-ui.js');s=p.read_text()
          old="  function closeExpanded(){if($('#studio-dialog').open)$('#studio-dialog').close();}\n  $('#expand-studio').addEventListener('click',()=>{lastFocus=document.activeElement;"
          new="""  // Touch browsers need an explicit opener: tapping a button need not focus it.
            // Move the shared editor back synchronously before handing focus to an estimate.
            function restoreExpanded() {
              const dialog = $('#studio-dialog');
              if (dialog.open || workspace.parentElement !== dialog) return;
              $('#studio-home-slot').append(workspace);
              $('#expand-studio').hidden = false;
              $('#close-studio').hidden = true;
              document.body.classList.remove('studio-open');
              fit();
              const opener = lastFocus || $('#expand-studio');
              lastFocus = null;
              opener.focus({preventScroll:true});
            }
            function closeExpanded() {
              if ($('#studio-dialog').open) $('#studio-dialog').close();
              restoreExpanded();
            }
            $('#expand-studio').addEventListener('click',event=>{lastFocus=event.currentTarget;"""
          assert s.count(old)==1
          s=s.replace(old,new)
          old="  $('#studio-dialog').addEventListener('close',()=>{$('#studio-home-slot').append(workspace);$('#expand-studio').hidden=false;$('#close-studio').hidden=true;document.body.classList.remove('studio-open');fit();lastFocus?.focus({preventScroll:true});});"
          assert s.count(old)==1
          p.write_text(s.replace(old,"  $('#studio-dialog').addEventListener('close',restoreExpanded);"))
          p=Path('base.css');s=p.read_text();assert s.count('summary>span{color:#667056')==1
          p.write_text(s.replace('summary>span{color:#667056','summary>span{color:#46513c'))
          p=Path('index.html');s=p.read_text();assert s.count('pattern="[+()0-9 .-]{7,30}"')==1
          p.write_text(s.replace('pattern="[+()0-9 .-]{7,30}"',r'pattern="[+0-9 .\(\)\-]{7,30}"'))
          p=Path('tests/browser.mjs');s=p.read_text()
          s=s.replace("await p.locator('#expand-studio').click();await stable(p);", "if(width<500)await p.locator('#expand-studio').tap();else await p.locator('#expand-studio').click();await stable(p);",1)
          old="    await p.locator('#use-preview').click();\n    assert.match"
          new="""    // Native Escape dispatches a queued close event. Wait for the user-visible result.
              await p.locator('#expand-studio').click();
              await p.keyboard.press('Escape');
              await p.waitForFunction(()=>!document.querySelector('#studio-dialog').open&&document.activeElement===document.querySelector('#expand-studio'));
              // Handoff from inside the modal must not have its focus stolen by a late close event.
              await p.locator('#expand-studio').click();
              await p.locator('#use-preview').click();
              await stable(p);
              await p.waitForFunction(()=>!document.querySelector('#studio-dialog').open&&document.activeElement===document.querySelector('input[name="name"]'));
              assert.match"""
          assert s.count(old)==1
          s=s.replace(old,new)
          s=s.replace('const errors=[], failures=[], external=[];', 'const errors=[], failures=[], external=[], posts=[];')
          s=s.replace("p.on('pageerror', e=>errors.push(e.message));", "p.on('pageerror', e=>errors.push(e.message));\n  p.on('console', msg=>{if(msg.type()==='error')errors.push(msg.text());});")
          s=s.replace("p.on('request', r=>{if(/^https?:/.test(r.url())", "p.on('request', r=>{if(r.method()==='POST')posts.push(r.url());if(/^https?:/.test(r.url())")
          s=re.sub(r'\|[^|/]+@gmail\\\.com', '', s)
          s=s.replace('assert.deepEqual(external,[],`${name}: unexpected external request`);', 'assert.deepEqual(external,[],`${name}: unexpected external request`);assert.deepEqual(posts,[],`${name}: unexpected form transmission`);')
          p.write_text(s)
          expected={'base.css':'41894984b307165e4ec18babb7503491b0ee653d95f02d1f2860b869b81c3694','index.html':'45074f70bf09490b4268179ba965054c23c13607cbfaaa648303c28b577f7433','studio-ui.js':'b8cff461a619c1bb2d5e566f4948ff256547b2dc21c99f9b672e7bfa909770cd','tests/browser.mjs':'9df7b93533a892af0a6aeb5e78e73923c1871922d86ea6440b65e4a6b29994b2'}
          for name,digest in expected.items():
              actual=hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual==digest,(name,actual,digest)
              print('Verified',name,actual)
          PY
      - run: node --test tests/core.test.cjs
      - name: Commit only the verified runtime and regression-test edits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add studio-ui.js base.css index.html tests/browser.mjs
          git commit -m 'Fix touch dialog focus and color contrast; protect modal handoff and contact validation'
          git push origin HEAD:cimo-studio-refresh-2026-09-09
