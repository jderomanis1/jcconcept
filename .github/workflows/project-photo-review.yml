name: Review selected project photo delivery
on:
  push:
    branches: [cimo-photo-copy-2026-09-10]
    paths: [.github/workflows/project-photo-review.yml]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read only the user-selected project photos through normal public URLs
        run: |
          mkdir -p /tmp/project-photo-review
          python3 - <<'PY'
          from urllib.request import urlopen
          from pathlib import Path
          import json
          items=[('interior','12ejHbuy-8WgynQRWJC0PUnpDSf3oz9qn'),('preparation','1FUiH-5uHBQdM92ev5F1zjOkFzfVZ79G3'),('workshop','12f4A1H_r-m9hWQHnh25pe0PaNZDlQbQo')]
          result=[]
          for name,fid in items:
              try:
                  with urlopen(f'https://drive.google.com/thumbnail?id={fid}&sz=w4000',timeout=20) as r:
                      data=r.read();mime=r.headers.get('Content-Type','')
                  assert mime.startswith('image/'),mime
                  Path('/tmp/project-photo-review/'+name+'.jpg').write_bytes(data)
                  result.append({'name':name,'read':True,'bytes':len(data)})
              except Exception as e:
                  result.append({'name':name,'read':False,'reason':str(e)})
          Path('/tmp/project-photo-review/result.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: selected-project-photo-review
          path: /tmp/project-photo-review
          retention-days: 2
