name: Deploy static site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vendor production fonts
        run: |
          mkdir -p /tmp/cimo-fonts
          npm install --prefix /tmp/cimo-fonts --no-save --ignore-scripts \
            @fontsource-variable/manrope@5.3.0 \
            @fontsource-variable/dm-sans@5.3.0
      - name: Stage public website files
        run: |
          mkdir -p _site/assets/fonts
          cp index.html config.js styles.css base.css studio.css site.css responsive.css script.js site.js studio-core.js studio-ui.js estimate.js _site/
          cp -R assets/. _site/assets/
          cp /tmp/cimo-fonts/node_modules/@fontsource-variable/manrope/files/manrope-latin-wght-normal.woff2 _site/assets/fonts/
          cp /tmp/cimo-fonts/node_modules/@fontsource-variable/dm-sans/files/dm-sans-latin-wght-normal.woff2 _site/assets/fonts/
          cp /tmp/cimo-fonts/node_modules/@fontsource-variable/manrope/LICENSE _site/assets/fonts/MANROPE-OFL.txt
          cp /tmp/cimo-fonts/node_modules/@fontsource-variable/dm-sans/LICENSE _site/assets/fonts/DM-SANS-OFL.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
