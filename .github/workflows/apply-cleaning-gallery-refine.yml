name: Apply cleaning and gallery refinement
on:
  push:
    branches: [cimo-cleaning-gallery-refine-2026-09-10]
    paths: [.github/workflows/apply-cleaning-gallery-refine.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cimo-cleaning-gallery-refine-2026-09-10
      - name: Apply approved on-site Cleaning referral changes
        run: python3 scripts/apply_cleaning_gallery_refine.py
      - name: Verify no external Cleaning booking link remains
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          section=re.search(r'<section class="cleaning-section wrap" id="cleaning"[\s\S]*?</section>',s).group(0)
          assert 'setmore.com' not in section
          assert section.count('class="cleaning-card"')==3
          assert 'trusted family cleaning partner' in section
          PY
      - name: Commit generated home-page refinement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Keep Cleaning overview on-site and route interest through Justin'
          git push origin HEAD:cimo-cleaning-gallery-refine-2026-09-10
