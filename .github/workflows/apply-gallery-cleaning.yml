name: Apply Cimo gallery and cleaning
on:
  push:
    branches: [cimo-gallery-cleaning-2026-09-10]
    paths: [.github/workflows/apply-gallery-cleaning.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cimo-gallery-cleaning-2026-09-10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the reviewed static pages and preserve the original runtime
        run: python3 scripts/install_gallery_cleaning.py
      - name: Syntax and content verification
        run: |
          node --check gallery.js
          node --test tests/core.test.cjs tests/content.test.cjs tests/gallery.test.cjs
      - name: Commit verified generated pages to the review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html gallery.html gallery-data.json additions.css scripts/stage.py scripts/stage_painting.py sitemap.xml docs/GALLERY_CLEANING_REVIEW.md
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git diff --cached --quiet || git commit -m 'Publish themed project gallery and compact Cleaning content for review'
          git push origin HEAD:cimo-gallery-cleaning-2026-09-10
      - name: Archive source for review
        if: always()
        run: tar --exclude=.git -czf /tmp/cimo-gallery-source.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cimo-gallery-source
          path: /tmp/cimo-gallery-source.tar.gz
          retention-days: 7
