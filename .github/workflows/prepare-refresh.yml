name: Apply reviewed Cimo source
on:
  push:
    branches: [cimo-studio-refresh-2026-09-09]
    paths: [.github/workflows/prepare-refresh.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cimo-studio-refresh-2026-09-09
      - name: Verify and apply locally tested source without changing its bytes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, lzma, shutil
          packed=base64.b64decode(''.join(Path(f'.transfer/release-{n}.b64').read_text() for n in range(4)),validate=True)
          assert hashlib.sha256(packed).hexdigest()=='110fd09d5ce32e52d9a935c0e86ce14222e69f045ecfbfd833f367e0e821e2ef'
          files=json.loads(lzma.decompress(packed))
          allowed={'index.html','404.html','config.js','base.css','studio.css','site.js','studio-core.js','studio-ui.js','assets/room-illustration.svg','assets/projects/README.md','scripts/stage.py','tests/core.test.cjs','tests/browser.mjs','.github/workflows/qa.yml','.github/workflows/pages.yml','README.md','docs/RELEASE_REVIEW.md','.gitignore'}
          assert set(files)==allowed
          for name,content in files.items():
              path=Path(name);path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(content.encode('utf-8'))
              print(hashlib.sha256(path.read_bytes()).hexdigest(),name)
          for name in ['estimate.js','script.js','studio-touch.js','site.css','responsive.css','revamp.css','styles.css','FEEDBACK.md','assets/projects/manifest.json','.github/workflows/accessibility.yml','.github/workflows/prepare-refresh.yml']:
              Path(name).unlink(missing_ok=True)
          shutil.rmtree('.transfer')
          PY
      - name: Confirm syntax and deterministic image behavior
        run: |
          for file in config.js site.js studio-core.js studio-ui.js; do node --check "$file"; done
          node --test tests/core.test.cjs
      - name: Commit the verified source on its review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Rebuild Cimo branding, painting content and shared Color Studio with functional QA'
          git push origin HEAD:cimo-studio-refresh-2026-09-09
      - name: Archive applied source
        if: always()
        run: tar --exclude=.git -czf /tmp/cimo-source.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cimo-applied-source
          path: /tmp/cimo-source.tar.gz
          retention-days: 7
