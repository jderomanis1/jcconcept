name: Prepare licensed garage example
on:
  push:
    branches: [cimo-photo-copy-2026-09-10]
    paths: [.github/workflows/photo-review.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cimo-photo-copy-2026-09-10
      - run: python3 -m pip install Pillow==11.3.0
      - name: Crop the licensed photo without changing the property
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen
          from PIL import Image, ImageOps
          import io, json, hashlib
          url='https://images.unsplash.com/photo-1764339838883-4728d4bcfe49?auto=format&fit=crop&fm=jpg&w=3000&q=90'
          data=urlopen(url,timeout=60).read()
          im=ImageOps.exif_transpose(Image.open(io.BytesIO(data))).convert('RGB')
          assert im.width==3000
          crop=[1650,700,2850,1600]
          im=im.crop(crop).resize((960,720),Image.Resampling.LANCZOS)
          out=Path('assets/projects/garage-example.webp')
          Image.frombytes('RGB',im.size,im.tobytes()).save(out,'WEBP',quality=82,method=6)
          provenance={'asset':'garage-example.webp','kind':'licensed illustrative photo, not a Cimo project','author':'KK Buys Indy Homes','source_page':'https://unsplash.com/photos/a-white-two-story-house-with-a-garage-6I3tJUF1jA4','license':'Unsplash License','download_url':url,'source_sha256':hashlib.sha256(data).hexdigest(),'crop_pixels':crop,'output_size':[960,720],'output_sha256':hashlib.sha256(out.read_bytes()).hexdigest(),'changes':'Crop to garage, excluding the street number; downsize and remove metadata. No repainting, object removal or generative edits.'}
          Path('docs/garage-photo-source.json').write_text(json.dumps(provenance,indent=2)+'\n')
          PY
      - name: Commit the licensed asset to the review branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/projects/garage-example.webp docs/garage-photo-source.json
          git diff --cached --quiet || git commit -m 'Add licensed garage example with crop and source provenance'
          git push origin HEAD:cimo-photo-copy-2026-09-10
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-garage-example
          path: |
            assets/projects/garage-example.webp
            docs/garage-photo-source.json
          retention-days: 7
