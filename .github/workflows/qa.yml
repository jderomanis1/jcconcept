name: Cimo QA
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax and deterministic image tests
        run: |
          for file in config.js site.js studio-core.js studio-ui.js; do node --check "$file"; done
          node --test tests/core.test.cjs tests/content.test.cjs
      - name: Install image-build dependency
        timeout-minutes: 2
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Install pinned browser-test packages
        timeout-minutes: 3
        run: npm install --no-save --package-lock=false --no-audit --no-fund --fetch-retries=1 --fetch-timeout=45000 playwright@1.55.0 axe-core@4.10.3
      - name: Install test browsers and operating-system dependencies
        timeout-minutes: 5
        run: npx --no-install playwright install --with-deps chromium webkit
      - name: Build the exact Pages directory
        run: python3 scripts/stage.py
      - name: Test desktop, mobile, WebKit, accessibility, uploads and export
        run: |
          python3 -m http.server 4173 --directory _site >/tmp/cimo-http.log 2>&1 &
          node tests/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cimo-qa-evidence
          path: qa-artifacts/
          retention-days: 14
      - name: Archive tested source
        if: always()
        run: tar --exclude=.git --exclude=node_modules --exclude=_site --exclude=qa-artifacts -czf /tmp/cimo-source.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cimo-tested-source
          path: /tmp/cimo-source.tar.gz
          retention-days: 7
