name: Cimo QA

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Static site checks
        run: |
          for file in script.js site.js studio-core.js studio-ui.js estimate.js; do node --check "$file"; done
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import json
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          HTMLParser().feed(html)

          start = html.index('<script type="application/ld+json">') + len('<script type="application/ld+json">')
          end = html.index('</script>', start)
          schema = json.loads(html[start:end])
          assert schema['@type'] == 'HousePainter'
          assert len(schema['areaServed']) >= 13
          assert '<span id="year">2026</span>' in html
          assert 'class="header-contact"' in html
          assert 'class="nav-contact"' in html
          assert 'class="standard-flow"' in html
          assert 'class="closing-contact"' in html
          assert 'assets/cimo-interior.webp' in html
          assert 'assets/cimo-exterior-garage.webp' in html
          assert 'assets/cimo-surface-prep.webp' in html
          assert 'assets/cimo-small-business.webp' in html
          assert 'class="hero-img"' in html and 'fetchpriority="high"' in html
          assert not re.search(r'href="(?:tel|sms):(?!\+1)', html)
          PY
          test ! -d server
          test ! -f render.yaml
          ! grep -RniE 'nodemailer|GMAIL_APP_PASSWORD|/api/contact|twilio|SMS_' . --exclude-dir=.git
          grep -q "https://formsubmit.co/ajax/jcimo47@gmail.com" config.js
          grep -q "'Content-Type': 'application/json'" estimate.js
          grep -q "JSON.stringify(submissionFields(raw))" estimate.js
          grep -q "buildMultipartSubmission" estimate.js
          grep -q "postEstimate(endpoint, raw, false)" estimate.js
          grep -q "_subject" estimate.js
          grep -q "_template" estimate.js
          grep -q "_captcha" estimate.js
          grep -q "_honey" estimate.js
          grep -q "_url" estimate.js
          grep -q "_replyto" estimate.js
          grep -q "selected_color" estimate.js
          grep -q "surface_description" estimate.js
          grep -q "estimate-next-steps" estimate.js
          grep -q "lastTrigger" estimate.js
          grep -q "dialog.addEventListener('close'" estimate.js
          grep -q "fonts.googleapis.com/css2" index.html
          ! grep -q "loadGoogleFonts" script.js
          ! grep -q "applyContentRefresh" site.js
          ! grep -q "removeAttribute('srcset')" site.js
          grep -q "aria-current" site.js
          grep -q "studio-quickstart" studio-ui.js
          grep -q "Fine-tune selection" studio-ui.js
          grep -q "max-width:1100px" responsive.css
          ! grep -q "footer>div:nth-child(4){display:none" responsive.css
          ! grep -q "\.steps" responsive.css site.css studio.css
          grep -q "globalCompositeOperation = 'color'" studio-core.js
          test -f robots.txt
          test -f sitemap.xml
          test -f 404.html
